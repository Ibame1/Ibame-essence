<!DOCTYPE html>
<!-- Source for the social-share images and icons. Rendered by tools/render-social.py (not deployed). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="/assets/site.css" />
<style>
  html,body{margin:0;background:#050505}
  body{position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#F5F5F0}
  .scene{display:none}
  body[data-mode="og"] .og, body[data-mode="coaster"] .og{display:block;width:1200px;height:630px;position:relative}
  body[data-mode="icon"] .icon, body[data-mode="icon-square"] .icon{display:flex}
  .glow{position:absolute;inset:0;background:radial-gradient(60% 95% at 22% 30%,rgba(184,115,51,.22),transparent 70%)}
  .left{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .brand{display:flex;align-items:center;gap:22px}
  .brand img{height:64px;width:auto}
  .brand b{font:italic 500 56px/1 "Playfair Display","Playfair Fallback",serif;color:#B87333;letter-spacing:.02em}
  .kick{font-size:20px;letter-spacing:.32em;text-transform:uppercase;color:#B87333;font-weight:600}
  h1{margin:0;font:400 68px/1.06 "Playfair Display","Playfair Fallback",serif;color:#F5F5F0}
  h1 em{color:#8A8A8A}
  body[data-mode="coaster"] h1 em{color:#c9833e}
  .photo{position:absolute;right:56px;top:56px;width:518px;height:518px;border-radius:28px;border:1px solid rgba(184,115,51,.28);background:#0F0E13;padding:10px;box-sizing:border-box}
  .photo img{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block}
  .icon{width:512px;height:512px;align-items:center;justify-content:center;background:#050505}
  body[data-mode="icon"]{background:transparent}
  body[data-mode="icon"] .icon{border-radius:22%}
  .icon span{font:italic 600 380px/1 "Playfair Display",serif;color:#B87333;transform:translate(-2%,-3%)}
</style>
</head>
<body>
  <div class="scene og">
    <div class="glow"></div>
    <div class="left">
      <div class="brand" id="brand"><img src="/img/ibame-wordmark-white.webp" alt="" /><b>Essence</b></div>
      <div class="kick" id="kick"></div>
      <h1 id="title"></h1>
      <div class="kick" id="sub" style="font-size:15px;color:#8A8A8A;letter-spacing:.24em;white-space:nowrap"></div>
    </div>
    <div class="photo"><img id="photo" alt="" /></div>
  </div>
  <div class="scene icon"><span>E</span></div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'og';
  document.body.dataset.mode = mode;
  if (mode === 'icon') document.documentElement.style.background = 'transparent';
  if (mode === 'og') {
    kick.textContent = 'Montréal Workshop';
    title.innerHTML = 'Crafted by hand.<br><em>Used every day.</em>';
    sub.textContent = 'Handmade in Montréal · Salvaged urban wood';
    photo.src = '/img/africa-clock-1080.webp';
  } else if (mode === 'coaster') {
    brand.innerHTML = '<b style="font-style:normal;font-size:30px;letter-spacing:.3em;text-transform:uppercase;font-family:Inter,sans-serif;font-weight:600">IBAME Maison</b>';
    kick.textContent = 'Black Walnut';
    title.innerHTML = 'Tap the wood.<br><em>Hear the maker.</em>';
    sub.textContent = 'essence.ibame.ca';
    photo.src = '/img/coaster-honeycomb-1080.webp';
  }
</script>
</body>
</html>
